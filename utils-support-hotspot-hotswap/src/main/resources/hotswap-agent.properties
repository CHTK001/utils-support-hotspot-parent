# HotswapAgent 配置文件
# 用于配置 HotswapAgent 的行为和自定义插件

# ==================== 插件配置 ====================

# 自定义插件包路径（已禁用，使用 Hotspot 自己的插件机制）
# pluginPackages=com.chua.hotspot.hotswap.support.agent

# ==================== 监听配置 ====================

# 额外监听的资源路径（逗号分隔）
# extraClasspath=

# 监听的资源变更（默认监听 .class 文件）
# watchResources=

# ==================== 日志配置 ====================

# 日志级别：TRACE, DEBUG, INFO, WARNING, ERROR
LOGGER.org.hotswap.agent=INFO

# ==================== 插件开关 ====================

# 禁用特定插件（如果不需要某些内置插件）
# disabledPlugins=

# Spring 插件配置
# Spring Bean 重载策略：NEVER, FIELDS_ONLY, ALL_FIELDS, DEFAULT
spring.basePackagePrefixes=com.chua

# ==================== 性能配置 ====================

# 自动热替换延迟时间（毫秒），用于批量处理多个文件变更
autoHotswap=true
autoHotswap.port=
